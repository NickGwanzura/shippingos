services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-shippingos}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shippingos}?schema=shipping
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      NEXTAUTH_URL: ${APP_URL:?Set APP_URL}
      NEXT_PUBLIC_APP_URL: ${APP_URL:?Set APP_URL}
      AUTH_TRUST_HOST: "true"
      SEED_DEMO_DATA_IF_EMPTY: "true"
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shippingos}
      POSTGRES_USER: ${POSTGRES_USER:-shippingos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - shippingos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  shippingos_postgres_data:
